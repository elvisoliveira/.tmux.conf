if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal tmux-256color' \
  'set -g default-terminal screen-256color'

# Pass through extended key encodings (needed for Ctrl+Shift+<key> in nvim).
# Alacritty speaks kitty CSI-u natively; tmux's default xterm modifyOtherKeys
# format fails the handshake, so force CSI-u here.
set -s extended-keys-format csi-u
set -g extended-keys always
set -as terminal-features ',*:extkeys'

# 0ms for key sequences.
set -s escape-time 0

# Set border on PowerLine.
setw -g pane-border-status top
setw -g pane-border-format "#P: #{pane_title}"

# Set VI mode globally.
set-window-option -g mode-keys vi

# Pane on top.
set-option -g status-position bottom

# Prefer fish when available, but do not hard-fail on machines where it lives elsewhere.
run-shell 'p=$(command -v fish); [ -n "$p" ] && tmux set-option -g default-shell "$p"'

# Vim navigation arrows.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -Troot C-w switch-client -Twindows
bind-key -Twindows h if-shell "$is_vim" { send-keys C-w h } { if-shell -F '#{pane_at_left}'   {} { select-pane -L } }
bind-key -Twindows j if-shell "$is_vim" { send-keys C-w j } { if-shell -F '#{pane_at_bottom}' {} { select-pane -D } }
bind-key -Twindows k if-shell "$is_vim" { send-keys C-w k } { if-shell -F '#{pane_at_top}'    {} { select-pane -U } }
bind-key -Twindows l if-shell "$is_vim" { send-keys C-w l } { if-shell -F '#{pane_at_right}'  {} { select-pane -R } }

bind h if-shell "$is_vim" { send-keys C-w h } { if-shell -F '#{pane_at_left}'   {} { select-pane -L } }
bind j if-shell "$is_vim" { send-keys C-w j } { if-shell -F '#{pane_at_bottom}' {} { select-pane -D } }
bind k if-shell "$is_vim" { send-keys C-w k } { if-shell -F '#{pane_at_top}'    {} { select-pane -U } }
bind l if-shell "$is_vim" { send-keys C-w l } { if-shell -F '#{pane_at_right}'  {} { select-pane -R } }

bind-key F3 if-shell -F '#{mouse}' \
  'set-option -g mouse off; display-message "Mouse: OFF"' \
  'set-option -g mouse on; display-message "Mouse: ON"'

# Toggle TTY keymap (us <-> br-abnt2). No-op outside TTY.
bind-key -n M-i run-shell '~/.env/.tmux.conf/bin/tty-kbd-toggle'

# Custom display pane timer.
set -g display-panes-time 5000

# TMUX Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'samoshkin/tmux-plugin-sysstat'
set -g @plugin 'seebi/tmux-colors-solarized'

clock_br="BR #(TZ=\"America/Sao_Paulo\" date +%%H:%%M)"
clock_nl="NL #(TZ=\"Europe/Amsterdam\" date +%%H:%%M)"
clock_uk="UK #(TZ=\"Europe/London\" date +%%H:%%M)"
keyboard_layout="#(~/.env/.tmux.conf/bin/status-seg KB ~/.env/.tmux.conf/bin/keyboard-layout)"
battery="#(~/.env/.tmux.conf/bin/status-seg BAT ~/.env/.tmux.conf/bin/battery)"
wg_is_keys_off="#([ \"$(tmux show-option -qv key-table)\" = 'off' ] && echo '#[bg=colour160 fg=colour231 bold]PREFIX OFF#[default]' || echo '#[fg=colour240]PREFIX ON#[default]')"

set-option -g status-right "$wg_is_keys_off$keyboard_layout | #{sysstat_cpu} | #{sysstat_mem}$battery | $clock_br | $clock_nl | $clock_uk"
set -g status-right-length 600
set -g status-left-length 600

# TMUX Plugin Manager
run '~/.tmux/plugins/tpm/tpm'

# Solarized Config.
set -g @colors-solarized 'dark'

# Border Setup
set -g pane-border-style fg=colour238,bg=colour235
set -g pane-active-border-style fg=colour51,bg=colour236

# New panes on same dir
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind-key = set-window-option synchronize-panes

# Use v to trigger selection
bind-key -T copy-mode-vi v send-keys -X begin-selection

bind-key r source-file ~/.tmux.conf

bind-key -n M-v paste-buffer

# Swap panes
bind-key H run-shell '~/.env/.tmux.conf/bin/tmux-swap-pane left'
bind-key J run-shell '~/.env/.tmux.conf/bin/tmux-swap-pane down'
bind-key K run-shell '~/.env/.tmux.conf/bin/tmux-swap-pane up'
bind-key L run-shell '~/.env/.tmux.conf/bin/tmux-swap-pane right'

# Use y to yank current selection
# bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind b \
  set prefix None \;\
  set key-table off \;\
  set status-style 'bg=colour52,fg=colour255' \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S

bind -T off b \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  refresh-client -S

set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

set -g focus-events on
set -g history-limit 100000
