# ISOLATED config for the nested tmux of the git panel (run inside the floating
# pane by tmux-git-nested). Loaded via `tmux -f`, so it does NOT inherit
# ~/.tmux.conf: no plugins, tpack, heavy status, notifyd or resurrect.
# It's a read-only viewer; navigation is prefix-less.

# Prefix C-a for this session. C-b normally belongs to the OUTER tmux, so a stray
# C-b leaks out there. BUT the outer's LOCK (C-Space) sets its prefix to None,
# which passes C-b through to us — so we also claim C-b as prefix2. Effect: with
# LOCK on, the outer's own C-b h/j/k/l pane navigation works here too; with LOCK
# off, C-b never reaches us and prefix2 is simply dormant.
set -g prefix C-a
set -g prefix2 C-b

set -g mode-keys vi
# Mouse off by default: the panel is keyboard-driven (⇧hjkl / C-hjkl / type to
# filter), and a stray click/drag would only steal focus or start a selection.
set -g mouse off
set -s escape-time 0
set -g renumber-windows on

# No window list; a thin status line with just the key hints.
set -g status on
set -g status-style 'bg=colour235,fg=colour245'
set -g status-left ' #[fg=colour51,bold]git#[default] '
set -g status-left-length 20
set -g status-right ' C-hjkl: panes · type: filter · ⇧hjkl: move · PgUp: scroll · C-z: zoom · C-r: refresh · C-g/C-q: quit '
set -g status-right-length 100
set -g window-status-format ''
set -g window-status-current-format ''

# Title on each pane (shows what each quadrant is).
setw -g pane-border-status top
setw -g pane-border-format ' #{pane_title} '
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour51

# Pane navigation is prefix-only, mirroring the outer tmux's prefix+hjkl. The
# outer's prefix is C-b, but it swallows C-b before the float sees it, so here the
# same gesture is C-a (this session's prefix) then h/j/k/l — and C-b too whenever
# the outer LOCK lets it through (prefix2). Bare Ctrl+letter is intentionally NOT
# bound, so every letter stays free for the fzf filter. Tab still cycles.
bind -n Tab select-pane -t ':.+'
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Zoom (toggle) the current pane, and grow the float to match (tmux-git-zoom
# resizes THIS float in the outer tmux so the zoom gains real screen, not just
# the 85% box). Works the same in fzf and static panes.
bind -n C-z resize-pane -Z \; run-shell '~/.env/.tmux.conf/bin/tmux-git-zoom'

# Refresh (re-render every pane) and quit. C-q always quits. C-g also closes:
# normally the OUTER tmux intercepts C-g first (its toggle), but while the float
# is open the outer is auto-locked (key-table off) so its bindings are suspended
# and C-g falls through to here — handle it locally. Killing the server ends the
# attach, which closes the float and (via the nested cleanup) lifts the lock.
bind -n C-r run-shell '~/.env/.tmux.conf/bin/tmux-git-refresh'
bind -n C-q kill-server
bind -n C-g kill-server

# Scroll: PageUp enters copy-mode (mouse is off, so no wheel scroll).
bind -n PPage copy-mode -u

# Diff-pane scroll without reaching for PageUp first. The diff is a static delta
# render, so scrolling means copy-mode: when the diff pane is focused these keys
# auto-enter it and scroll (C-d/C-u half-page, ⇧J/⇧K one line). On the fzf panes
# the same keys fall through — send-keys re-injects them past the key table, so
# ⇧J/⇧K still drive the fzf list and C-d/C-u still half-page it.
bind -n C-d if-shell -F '#{==:#{pane_title},diff}' 'copy-mode -e ; send-keys -X halfpage-down' 'send-keys C-d'
bind -n C-u if-shell -F '#{==:#{pane_title},diff}' 'copy-mode -e ; send-keys -X halfpage-up'   'send-keys C-u'
bind -n J   if-shell -F '#{==:#{pane_title},diff}' 'copy-mode -e ; send-keys -X scroll-down'   'send-keys J'
bind -n K   if-shell -F '#{==:#{pane_title},diff}' 'copy-mode -e ; send-keys -X scroll-up'     'send-keys K'

# Once inside copy-mode: ⇧J/⇧K keep line-scrolling (C-d/C-u are vi defaults). To
# leave for another pane, the prefix works from copy-mode too (C-a/C-b h/j/k/l),
# so a scrolled diff is never a dead end without needing bare Ctrl bindings.
bind -T copy-mode-vi J send-keys -X scroll-down
bind -T copy-mode-vi K send-keys -X scroll-up

# Auto-cleanup: if the float is closed from outside (the client detaches), kill
# the nested server instead of leaving it orphaned. Does not fire on the initial
# attach.
set-hook -g client-detached 'run-shell "tmux kill-server"'
